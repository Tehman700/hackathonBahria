version: '3.8'

services:
  moodle:
    build: .
    ports:
      - "8090:80"
    volumes:
      - ./moodle:/var/www/html
      - moodledata:/var/moodledata
    environment:
      MOODLE_DB_HOST: moodledb
      MOODLE_DB_USER: moodle
      MOODLE_DB_PASSWORD: moodle123
      MOODLE_DB_NAME: moodle
    depends_on:
      moodledb:
        condition: service_healthy
    restart: unless-stopped

  moodledb:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodle
      MYSQL_PASSWORD: moodle123
    volumes:
      - moodledb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "moodle", "-pmoodle123"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  moodledata:
  moodledb_data:
